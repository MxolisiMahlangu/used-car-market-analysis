<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
<defs><style>
.bg{fill:#f3f6fa}.panel{fill:#fff;stroke:#e4eaf1;stroke-width:1}.navy{fill:#214f78}.teal{fill:#08a6a6}.orange{fill:#f28c18}.muted{fill:#657386}.title{font:700 34px Arial,sans-serif;fill:#214f78}.sub{font:16px Arial,sans-serif;fill:#657386}.klabel{font:700 13px Arial,sans-serif;fill:#647286;letter-spacing:.5px}.kvalue{font:700 30px Arial,sans-serif;fill:#214f78}.ctitle{font:700 19px Arial,sans-serif;fill:#214f78}.axis{font:12px Arial,sans-serif;fill:#586575}.small{font:13px Arial,sans-serif;fill:#586575}
</style></defs>
<rect class="bg" width="1600" height="960"/>
<text x="64" y="65" class="title">USED CARS MARKET OVERVIEW</text>
<text x="64" y="96" class="sub">Executive dashboard concept  |  2,059 vehicle listings</text>
